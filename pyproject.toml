[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-sar"
version = "0.1.0"
description = "Decentralized Multi-Agent RL for Cooperative Search-and-Rescue Drone Swarms"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Swarm-SAR Contributors" }]
keywords = ["multi-agent", "reinforcement-learning", "drone-swarm",
            "search-and-rescue", "robotics", "CTDE", "MAPPO", "GNN", "transformer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0",
  "pyyaml>=6.0", "pydantic>=2.6,<3", "imageio>=2.30", "pillow>=10.0", "networkx>=3.1",
  "tqdm>=4.65", "rich>=13.0",
]

[project.optional-dependencies]
rl  = ["gymnasium>=0.29", "pettingzoo>=1.24", "torch>=2.1", "torch-geometric>=2.4", "ray[rllib]>=2.10.0", "tensorboard>=2.14"]
perception = ["ultralytics>=8.2"]
viz = ["plotly>=5.18", "streamlit>=1.30", "opencv-python>=4.8", "seaborn>=0.13", "imageio-ffmpeg>=0.4"]
sim = ["airsim>=1.8.1", "msgpack-rpc-python>=0.4.1"]
tune = ["optuna>=3.5"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "black>=23.9", "ruff>=0.1.6", "mypy>=1.6", "pre-commit>=3.5"]
all = ["swarm-sar[rl,viz,sim,perception,tune,dev]"]

[project.urls]
Homepage = "https://github.com/drone-swarm-sar/drone-swarm-sar"
Repository = "https://github.com/drone-swarm-sar/drone-swarm-sar"
Documentation = "https://drone-swarm-sar.github.io/drone-swarm-sar"

[project.scripts]
swarm-demo = "swarm_sar.scripts_entry:demo"
swarm-train = "swarm_sar.scripts_entry:train"
swarm-eval = "swarm_sar.scripts_entry:evaluate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "W", "UP", "B"]
lint.ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
