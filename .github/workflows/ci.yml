name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Must stay within pyproject's requires-python (>=3.11,<3.12);
        # 3.9/3.10 entries made `pip install -e .` fail by construction.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest pytest-cov ruff mypy
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src || true   # advisory until fully annotated
      - name: Unit tests
        run: pytest --cov=swarm_sar --cov-report=term-missing
      - name: Smoke demo (self-contained sim + figures)
        run: python scripts/run_demo.py --episodes 1 --figures --out results/ci
      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: "figures-py${{ matrix.python-version }}"
          path: "results/ci/**/*.png"
