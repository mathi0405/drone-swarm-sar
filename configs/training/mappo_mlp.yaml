# MAPPO + mlp (Centralized Training, Decentralized Execution)
env: { num_drones: 3, max_steps: 200 }
model: { arch: mlp, hidden_dim: 128 }
train:
  algo: mappo
  policy_sharing: shared
  centralized_critic: true
  num_envs: 4
  curriculum: true
  bc_warmstart_episodes: 8
  bc_epochs: 2
  imitation_coef: 0.02
  total_timesteps: 3000000
  lr: 0.0003
  seed: 0
log: { experiment_name: mappo_mlp, seeds: [0, 1, 2] }
