# Communication-reward experiment (GRU): identical to mappo_gru.yaml EXCEPT the
# receiver is now paid comm_assisted_rescue when it rescues a victim it first
# learned about over the radio.  Tests whether the learned channel — causally
# inert in the main campaign (assisted-rescue rate ~0) — becomes useful when
# acting on messages has a downstream payoff.  NOT comparable with the main
# campaign (different reward); evaluate against a same-config baseline.
env:
  num_drones: 3
  max_steps: 200
  comm: { auto_broadcast: false }
  reward: { comm_assisted_rescue: 25.0 }
model: { arch: gru, hidden_dim: 128 }
train:
  algo: mappo
  policy_sharing: shared
  centralized_critic: true
  num_envs: 16
  curriculum: true
  curriculum_mode: performance
  curriculum_linear_fallback: false
  bc_warmstart_episodes: 16
  bc_epochs: 3
  imitation_coef: 0.05
  imitation_anneal_frac: 0.5
  comm_gate_coef: 0.01
  comm_gate_warmup_frac: 0.2
  eval_episodes: 20
  total_timesteps: 3000000
  lr: 0.0003
  seed: 0
log: { experiment_name: mappo_gru_commreward, seeds: [0, 1, 2, 3, 4] }
